    # Used to provide instructions for installations.
    install:
        disk: /dev/disk/by-id/ata-Corsair_Force_GS_1411790100010011018A
        image: factory.talos.dev/metal-installer/ac9700dc18e59f2b7713baf4f436bcb870842007482c6241493e1f92948221eb:v1.11.3
