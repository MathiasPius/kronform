---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: multus-cni
  namespace: networking
spec:
  interval: 1m0s
  ref:
    tag: v4.2.3
  url: ssh://git@github.com:k8snetworkplumbingwg/multus-cni.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: multus-cni
  namespace: networking
spec:
  interval: 10m0s
  path: ./deployments/multus-daemonset-thick.yml
  prune: true
  sourceRef:
    kind: GitRepository
    name: multus-cni
